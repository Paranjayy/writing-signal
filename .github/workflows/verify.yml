name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  native-collector:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build native collector
        working-directory: native
        run: swift build -c release
